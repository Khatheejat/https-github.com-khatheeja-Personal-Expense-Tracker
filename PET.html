<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6f8;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #2c3e50;
        }

        .summary {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 10px;
            color: #555;
        }

        .income {
            color: #27ae60;
        }

        .expense {
            color: #e74c3c;
        }

        .balance {
            color: #2980b9;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .form-box h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .transactions {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .transactions h2 {
            margin-bottom: 15px;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            border-left: 5px solid;
            background: #f8f9fa;
            border-radius: 5px;
        }

        .transaction.income-border {
            border-color: #27ae60;
        }

        .transaction.expense-border {
            border-color: #e74c3c;
        }

        .transaction-info h4 {
            margin-bottom: 5px;
        }

        .transaction-info small {
            color: #777;
        }

        .amount {
            font-weight: bold;
            margin-right: 10px;
        }

        .delete-btn {
            width: auto;
            padding: 7px 10px;
            background: #e74c3c;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 20px;
        }

        @media (max-width: 600px) {
            .summary {
                grid-template-columns: 1fr;
            }

            .transaction {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .transaction-right {
                width: 100%;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>💰 Personal Expense Tracker</h1>

    <!-- Summary Cards -->
    <div class="summary">

        <div class="card">
            <h3>Total Income</h3>
            <h2 class="income" id="totalIncome">₹0.00</h2>
        </div>

        <div class="card">
            <h3>Total Expenses</h3>
            <h2 class="expense" id="totalExpense">₹0.00</h2>
        </div>

        <div class="card">
            <h3>Balance</h3>
            <h2 class="balance" id="balance">₹0.00</h2>
        </div>

    </div>


    <!-- Add Transaction Form -->
    <div class="form-box">

        <h2>Add Transaction</h2>

        <form id="expenseForm">

            <div class="form-group">
                <label for="description">Description</label>
                <input
                    type="text"
                    id="description"
                    placeholder="Example: Grocery shopping"
                    required
                >
            </div>

            <div class="form-group">
                <label for="amount">Amount (₹)</label>
                <input
                    type="number"
                    id="amount"
                    placeholder="Enter amount"
                    min="0"
                    step="0.01"
                    required
                >
            </div>

            <div class="form-group">
                <label for="type">Type</label>
                <select id="type">
                    <option value="expense">Expense</option>
                    <option value="income">Income</option>
                </select>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category">
                    <option value="Food">Food</option>
                    <option value="Travel">Travel</option>
                    <option value="Shopping">Shopping</option>
                    <option value="Education">Education</option>
                    <option value="Bills">Bills</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Salary">Salary</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" required>
            </div>

            <button type="submit">Add Transaction</button>

        </form>

    </div>


    <!-- Transaction History -->
    <div class="transactions">

        <h2>Transaction History</h2>

        <div id="transactionList"></div>

    </div>

</div>


<script>

    // Get HTML elements
    const form = document.getElementById("expenseForm");
    const descriptionInput = document.getElementById("description");
    const amountInput = document.getElementById("amount");
    const typeInput = document.getElementById("type");
    const categoryInput = document.getElementById("category");
    const dateInput = document.getElementById("date");

    const totalIncome = document.getElementById("totalIncome");
    const totalExpense = document.getElementById("totalExpense");
    const balance = document.getElementById("balance");
    const transactionList = document.getElementById("transactionList");


    // Set today's date automatically
    dateInput.valueAsDate = new Date();


    // Load saved transactions
    let transactions = JSON.parse(localStorage.getItem("transactions")) || [];


    // Add transaction
    form.addEventListener("submit", function(event) {

        event.preventDefault();

        const transaction = {
            id: Date.now(),
            description: descriptionInput.value,
            amount: Number(amountInput.value),
            type: typeInput.value,
            category: categoryInput.value,
            date: dateInput.value
        };

        transactions.push(transaction);

        saveTransactions();
        displayTransactions();
        updateSummary();

        form.reset();

        // Set date again after reset
        dateInput.valueAsDate = new Date();
    });


    // Save transactions to browser
    function saveTransactions() {

        localStorage.setItem(
            "transactions",
            JSON.stringify(transactions)
        );

    }


    // Display transactions
    function displayTransactions() {

        transactionList.innerHTML = "";

        if (transactions.length === 0) {

            transactionList.innerHTML =
                '<div class="empty">No transactions added yet.</div>';

            return;
        }


        // Show newest transaction first
        const reversedTransactions = [...transactions].reverse();


        reversedTransactions.forEach(function(transaction) {

            const div = document.createElement("div");

            div.className =
                "transaction " +
                (transaction.type === "income"
                    ? "income-border"
                    : "expense-border");


            const sign =
                transaction.type === "income" ? "+" : "-";


            div.innerHTML = `

                <div class="transaction-info">

                    <h4>${transaction.description}</h4>

                    <small>
                        ${transaction.category} |
                        ${transaction.date}
                    </small>

                </div>

                <div class="transaction-right">

                    <span class="amount ${
                        transaction.type === "income"
                            ? "income"
                            : "expense"
                    }">

                        ${sign} ₹${transaction.amount.toFixed(2)}

                    </span>

                    <button
                        class="delete-btn"
                        onclick="deleteTransaction(${transaction.id})">

                        Delete

                    </button>

                </div>

            `;


            transactionList.appendChild(div);

        });

    }


    // Delete transaction
    function deleteTransaction(id) {

        transactions = transactions.filter(function(transaction) {

            return transaction.id !== id;

        });

        saveTransactions();
        displayTransactions();
        updateSummary();

    }


    // Update income, expense and balance
    function updateSummary() {

        let income = 0;
        let expense = 0;


        transactions.forEach(function(transaction) {

            if (transaction.type === "income") {

                income += transaction.amount;

            } else {

                expense += transaction.amount;

            }

        });


        totalIncome.textContent =
            "₹" + income.toFixed(2);

        totalExpense.textContent =
            "₹" + expense.toFixed(2);

        balance.textContent =
            "₹" + (income - expense).toFixed(2);

    }


    // Display data when page opens
    displayTransactions();
    updateSummary();

</script>

</body>
</html>
